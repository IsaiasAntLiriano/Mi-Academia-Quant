<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academia Quant — Plataforma de Trading Cuantitativo y Opciones</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Custom Quant Styles (v6.0 Sky Blue & Cloud White Palette) -->
    <link rel="stylesheet" href="css/styles.css?v=6.0">
</head>
<body class="h-screen flex flex-col overflow-hidden bg-[#0B1120] text-[#F8FAFC]">

    <!-- Header Principal -->
    <header class="glass-panel border-b border-slate-800/80 py-3 px-4 md:px-6 flex justify-between items-center z-20 relative flex-shrink-0">
        <!-- Logo y Sidebar Toggle -->
        <div class="flex items-center gap-3">
            <button id="toggle-sidebar-btn" title="Alternar Menú Lateral" class="p-2 rounded-lg bg-slate-800/80 hover:bg-slate-700 text-slate-300 hover:text-[#F8FAFC] transition-colors border border-slate-700/50">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>
            </button>
            <div class="flex items-center gap-2 cursor-pointer" onclick="window.loadModule(1)">
                <svg class="w-7 h-7 text-[#2C99D6] flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 12l3-3 3 3 4-4M8 21l4-4 4 4M3 4h18M4 4h16v12a1 1 0 01-1 1H5a1 1 0 01-1-1V4z"></path>
                </svg>
                <div class="flex items-baseline">
                    <h1 class="text-xl font-black text-[#F8FAFC] tracking-tight">Academia <span class="text-[#2C99D6]">Quant</span></h1>
                </div>
            </div>
        </div>

        <!-- Breadcrumb / Título Central -->
        <div class="hidden md:flex items-center gap-2 max-w-md lg:max-w-xl truncate">
            <span id="header-category-badge" class="text-xs font-semibold px-2.5 py-0.5 rounded-full bg-slate-800/80 text-slate-300 border border-slate-700/70 whitespace-nowrap">
                Cargando...
            </span>
            <span class="text-slate-600">/</span>
            <span id="header-module-title" class="text-sm font-semibold text-[#F8FAFC] truncate">
                Cargando...
            </span>
        </div>

        <!-- Acciones Rápidas (Progreso y Navegación) -->
        <div class="flex items-center gap-2">
            <!-- Barra de Progreso Compacta -->
            <div class="hidden lg:flex items-center gap-2.5 px-3 py-1.5 rounded-lg bg-slate-800/60 border border-slate-700/60 text-xs">
                <span class="text-slate-400">Progreso:</span>
                <span id="header-progress-text" class="font-bold text-[#2C99D6] font-mono">0%</span>
                <div class="w-16 h-1.5 bg-slate-700 rounded-full overflow-hidden">
                    <div id="header-progress-bar" class="h-full bg-gradient-to-r from-[#2C99D6] to-[#38BDF8] progress-fill" style="width: 0%"></div>
                </div>
            </div>

            <!-- Botones Anterior y Siguiente Rápidos -->
            <div class="flex items-center gap-1">
                <button id="header-prev-btn" title="Módulo Anterior (←)" class="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-[#F8FAFC] transition-colors disabled:opacity-30 disabled:cursor-not-allowed border border-slate-700/50">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                    </svg>
                </button>
                <button id="header-next-btn" title="Siguiente Módulo (→)" class="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-[#F8FAFC] transition-colors disabled:opacity-30 disabled:cursor-not-allowed border border-slate-700/50">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <!-- Layout Principal -->
    <div class="flex flex-1 overflow-hidden relative">
        
        <!-- Sidebar Navigation (Desktop & Drawer Mobile) -->
        <aside id="sidebar-container" class="w-72 xl:w-80 glass-panel border-r border-slate-800 flex flex-col flex-shrink-0 z-10 transition-all duration-300">
            <!-- Barra Superior del Sidebar: Buscador y Avance -->
            <div class="p-3.5 border-b border-slate-800/80 space-y-3 bg-slate-900/40">
                <!-- Buscador de Módulos Instantáneo -->
                <div class="relative">
                    <input id="module-search" type="text" placeholder="🔍 Buscar tema, griega o estrategia..." 
                           class="w-full bg-slate-800/90 border border-slate-700/80 text-xs text-[#F8FAFC] rounded-lg pl-8 pr-3 py-2 placeholder-slate-500 focus:outline-none focus:border-[#2C99D6] transition-colors">
                    <svg class="w-4 h-4 text-slate-400 absolute left-2.5 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                </div>

                <!-- Tarjeta de Progreso del Alumno -->
                <div class="bg-slate-800/50 p-2.5 rounded-lg border border-slate-700/50 space-y-1.5">
                    <div class="flex justify-between items-center text-xs">
                        <span class="font-semibold text-slate-300">Avance de Estudio</span>
                        <span id="sidebar-progress-percent" class="font-bold text-[#2C99D6] font-mono">0%</span>
                    </div>
                    <div class="w-full h-1.5 bg-slate-700/70 rounded-full overflow-hidden">
                        <div id="sidebar-progress-bar" class="h-full bg-gradient-to-r from-[#2C99D6] to-[#38BDF8] progress-fill" style="width: 0%"></div>
                    </div>
                    <div class="flex justify-between items-center text-[11px] text-slate-400 pt-0.5">
                        <span id="sidebar-completed-count">0 de 39 módulos</span>
                        <button id="toggle-all-cats-btn" class="text-[#2C99D6] hover:underline">Colapsar todo</button>
                    </div>
                </div>
            </div>

            <!-- Lista Acordeón de Categorías y Módulos -->
            <nav id="nav-menu" class="flex-1 overflow-y-auto p-3 space-y-2">
                <!-- Secciones de acordeón inyectadas dinámicamente por app.js -->
            </nav>
        </aside>

        <!-- Área de Contenido Principal -->
        <main class="flex-1 overflow-y-auto p-4 md:p-6 lg:p-8 flex flex-col">
            <!-- Selector Móvil para pantallas ultra-pequeñas -->
            <div class="md:hidden mb-4">
                <select id="mobile-nav" class="w-full bg-slate-800 border border-slate-700 text-[#F8FAFC] rounded-lg p-2.5 text-sm focus:ring-[#2C99D6] focus:border-[#2C99D6]">
                    <!-- Opciones inyectadas por app.js -->
                </select>
            </div>

            <!-- Contenedor Maestro en 2 Columnas Balanceadas -->
            <div class="max-w-7xl mx-auto w-full grid grid-cols-1 lg:grid-cols-12 gap-5 lg:gap-6 items-start">
                
                <!-- Columna Izquierda: Teoría, Fórmulas y Guía de Estudio (7 Columnas en LG) -->
                <div class="lg:col-span-7 flex flex-col gap-4 min-w-0">
                    <!-- Barra de Meta e Indicadores del Módulo -->
                    <div class="flex justify-between items-center glass-panel px-4 py-2.5 rounded-xl border border-slate-800">
                        <div class="flex items-center gap-2 min-w-0">
                            <span id="meta-category-badge" class="text-xs font-semibold px-2.5 py-0.5 rounded-md bg-[#2C99D6]/15 text-[#2C99D6] border border-[#2C99D6]/30 font-mono truncate">
                                FUNDAMENTOS
                            </span>
                            <span class="text-xs text-slate-400 hidden sm:inline-flex items-center gap-1 flex-shrink-0">
                                <span>⏱️</span> ~4 min estudio
                            </span>
                        </div>
                        <!-- Botón de Estado / Completado -->
                        <button id="mark-completed-btn" class="flex items-center gap-1.5 text-xs font-semibold px-3 py-1.5 rounded-lg border border-slate-700 bg-slate-800/80 hover:bg-slate-700 text-slate-300 hover:text-[#F8FAFC] transition-all flex-shrink-0">
                            <span id="mark-completed-icon" class="text-emerald-400">○</span>
                            <span id="mark-completed-text">Marcar estudiado</span>
                        </button>
                    </div>

                    <!-- Panel de Contenido Teórico -->
                    <article id="theory-content" class="glass-panel p-6 md:p-8 rounded-2xl shadow-xl min-w-0">
                        <!-- Inyectado dinámicamente -->
                    </article>

                    <!-- Navegación Inferior Paso a Paso Anti-Solapamiento (CSS Grid Estricto) -->
                    <div class="glass-panel p-3.5 sm:p-4 rounded-xl border border-slate-800 min-w-0">
                        <div class="grid grid-cols-1 sm:grid-cols-12 gap-2 sm:gap-3 items-center w-full min-w-0">
                            <!-- Botón Anterior (5 columnas) -->
                            <div class="sm:col-span-5 min-w-0">
                                <button id="footer-prev-btn" class="w-full flex items-center justify-start gap-1.5 text-xs font-semibold px-3 py-2 rounded-lg bg-slate-800/90 hover:bg-slate-700 text-slate-300 hover:text-[#F8FAFC] transition-all disabled:opacity-30 disabled:cursor-not-allowed border border-slate-700/60 overflow-hidden min-w-0">
                                    <span class="flex-shrink-0 text-sm">←</span>
                                    <span class="text-slate-400 font-mono text-[11px] flex-shrink-0">Ant:</span>
                                    <span id="footer-prev-title" class="truncate min-w-0 text-left">Módulo previo</span>
                                </button>
                            </div>

                            <!-- Contador Central (2 columnas, nunca se envuelve) -->
                            <div class="sm:col-span-2 text-center order-first sm:order-none py-1 sm:py-0 min-w-0">
                                <span id="footer-module-counter" class="text-xs text-slate-400 font-mono whitespace-nowrap px-2 py-0.5 rounded bg-slate-800/60 border border-slate-700/40 inline-block">
                                    Módulo 1 de 39
                                </span>
                            </div>

                            <!-- Botón Siguiente (5 columnas) -->
                            <div class="sm:col-span-5 min-w-0">
                                <button id="footer-next-btn" class="w-full flex items-center justify-end gap-1.5 text-xs font-semibold px-3 py-2 rounded-lg bg-[#2C99D6] hover:bg-[#2381b5] text-[#F8FAFC] transition-all disabled:opacity-30 disabled:cursor-not-allowed shadow-md shadow-[#2C99D6]/20 overflow-hidden min-w-0">
                                    <span id="footer-next-title" class="truncate min-w-0 text-right">Siguiente</span>
                                    <span class="text-white/80 font-mono text-[11px] flex-shrink-0">Sig:</span>
                                    <span class="flex-shrink-0 text-sm">→</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Columna Derecha: Laboratorio Cuantitativo Interactivo (5 Columnas en LG, Sticky) -->
                <div class="lg:col-span-5 flex flex-col gap-4 sticky top-4 min-w-0">
                    <div class="glass-panel-elevated p-5 md:p-6 rounded-2xl shadow-2xl space-y-4">
                        <!-- Cabecera del Laboratorio -->
                        <div class="flex justify-between items-center border-b border-slate-700/80 pb-3">
                            <div class="flex items-center gap-2">
                                <span class="w-2.5 h-2.5 rounded-full bg-[#2C99D6] animate-pulse"></span>
                                <h3 id="chart-title" class="text-base font-bold text-[#F8FAFC] tracking-tight">Laboratorio Cuantitativo</h3>
                            </div>
                            <span id="chart-badge" class="text-[10px] font-mono font-bold px-2 py-0.5 rounded bg-[#2C99D6]/15 text-[#2C99D6] border border-[#2C99D6]/30 uppercase tracking-wider">
                                SIMULADOR
                            </span>
                        </div>

                        <!-- Canvas del Gráfico -->
                        <div class="relative w-full h-72 md:h-80 bg-slate-900/50 rounded-xl p-2 border border-slate-800/80">
                            <canvas id="mainChart"></canvas>
                        </div>

                        <!-- Controles de Simulación Integrados en la Misma Tarjeta -->
                        <div id="interactive-controls" class="space-y-3 pt-3 border-t border-slate-700/60 hidden">
                            <div class="flex justify-between items-center">
                                <span class="text-xs uppercase font-bold text-slate-400 tracking-wider">Parámetros de Simulación</span>
                                <span class="text-[11px] text-[#2C99D6] font-mono">Reactivo en tiempo real</span>
                            </div>
                            <div id="controls-container" class="space-y-3.5">
                                <!-- Sliders inyectados dinámicamente -->
                            </div>
                        </div>

                        <!-- Consola de Diagnóstico / Métricas -->
                        <div id="chart-description" class="text-xs text-slate-300 bg-slate-900/80 p-3.5 rounded-xl border border-slate-800 leading-relaxed font-sans">
                            <!-- Métricas y conclusiones inyectadas dinámicamente -->
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- Main ES6 Application Controller (v6.0 Sky Blue & Cloud White) -->
    <script type="module" src="js/app.js?v=6.0"></script>
</body>
</html>
