<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academia Quant: Opciones, Gamma & Skew</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Custom Quant Styles (v3 cache buster) -->
    <link rel="stylesheet" href="css/styles.css?v=3.0">
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <!-- Header -->
    <header class="glass-panel border-b border-slate-700 py-4 px-6 flex justify-between items-center z-10 relative">
        <div class="flex items-center gap-3">
            <svg class="w-8 h-8 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 12l3-3 3 3 4-4M8 21l4-4 4 4M3 4h18M4 4h16v12a1 1 0 01-1 1H5a1 1 0 01-1-1V4z"></path>
            </svg>
            <h1 class="text-2xl font-bold text-white tracking-tight">Academia <span class="text-blue-500">Quant</span></h1>
        </div>
        <div class="text-sm text-slate-400">
            Módulo actual: <span id="header-module-title" class="text-white font-semibold">Cargando...</span>
        </div>
    </header>

    <!-- Main Layout -->
    <div class="flex flex-1 overflow-hidden relative">
        
        <!-- Sidebar Navigation (Desktop) -->
        <aside class="w-64 glass-panel border-r border-slate-700 overflow-y-auto flex-shrink-0 hidden md:block">
            <div class="p-4">
                <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-4">Ruta de Aprendizaje</h2>
                <nav id="nav-menu" class="space-y-2">
                    <!-- Nav items inyectados dinámicamente vía app.js -->
                </nav>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 overflow-y-auto p-4 md:p-8 flex flex-col">
            <!-- Mobile Menu Toggle (Visible solo en pantallas pequeñas) -->
            <div class="md:hidden mb-4">
                <select id="mobile-nav" class="w-full bg-slate-800 border border-slate-600 text-white rounded-lg p-2 focus:ring-blue-500 focus:border-blue-500">
                    <!-- Opciones mobile inyectadas vía app.js -->
                </select>
            </div>

            <!-- Content Container -->
            <div class="max-w-5xl mx-auto w-full grid grid-cols-1 lg:grid-cols-2 gap-8">
                
                <!-- Columna de Teoría y Controles -->
                <div class="flex flex-col gap-6">
                    <div id="theory-content" class="glass-panel p-6 rounded-2xl shadow-xl">
                        <!-- Contenido teórico inyectado vía app.js -->
                    </div>

                    <!-- Panel de Controles Interactivos -->
                    <div id="interactive-controls" class="glass-panel p-6 rounded-2xl shadow-xl hidden">
                        <h3 class="text-lg font-bold text-white mb-4 border-b border-slate-600 pb-2">Controles de Simulación</h3>
                        <div id="controls-container" class="space-y-4">
                            <!-- Controles inyectados dinámicamente -->
                        </div>
                    </div>
                </div>

                <!-- Columna de Visualización / Gráfico -->
                <div class="flex flex-col gap-6">
                    <div class="glass-panel p-6 rounded-2xl shadow-xl sticky top-4">
                        <h3 id="chart-title" class="text-lg font-bold text-white mb-4">Visualizador Interactivo</h3>
                        <div class="relative w-full h-80">
                            <canvas id="mainChart"></canvas>
                        </div>
                        <p id="chart-description" class="text-sm text-slate-400 mt-4 italic">
                            <!-- Descripción y métricas en tiempo real inyectadas vía app.js -->
                        </p>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- Main ES6 Application Controller (v3 cache buster) -->
    <script type="module" src="js/app.js?v=3.0"></script>
</body>
</html>
